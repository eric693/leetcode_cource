<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>線上練習 - LeetCode 學習平台</title>
<meta name="description" content="在瀏覽器裡直接寫程式解題：支援 Python、TypeScript、JavaScript，即時執行測試與提交判題。">
<script>
  // 在畫面繪製前套用主題，避免閃爍
  (function () {
    var t = null;
    try { t = localStorage.getItem('lc:theme'); } catch (e) {}
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body data-no-guard>
<div class="app" id="app" data-mobile-view="desc">

  <header class="topbar">
    <div class="tb-left">
      <a class="brand" href="../index.html" title="回到題庫">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>題庫</span>
      </a>
      <span class="tb-sep"></span>
      <button class="tb-btn" id="btnList" title="題目列表">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M4 5.5h12M4 10h12M4 14.5h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="tb-label">題目列表</span>
      </button>
      <button class="tb-icon" id="btnPrev" title="上一題">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12 5 7 10l5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="tb-icon" id="btnNext" title="下一題">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m8 5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="tb-center">
      <button class="btn btn-run" id="btnRun" title="執行測試案例（Ctrl + Enter）">
        <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M6 4.5v11l9-5.5z" fill="currentColor"/></svg>
        <span>執行</span>
      </button>
      <button class="btn btn-submit" id="btnSubmit" title="提交並以所有測資判題（Ctrl + Shift + Enter）">
        <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M10 15V5m0 0-4 4m4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>提交</span>
      </button>
    </div>

    <div class="tb-right">
      <span class="kbd-hint"><kbd>Ctrl</kbd><kbd>↵</kbd> 執行</span>
      <button class="tb-icon" id="btnTheme" title="切換深色／淺色">
        <svg class="i-sun" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M15.5 12.2A6 6 0 0 1 7.8 4.5a6 6 0 1 0 7.7 7.7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <nav class="mobile-tabs" id="mobileTabs" aria-label="切換區塊">
    <button data-view="desc" class="active">題目</button>
    <button data-view="code">程式碼</button>
    <button data-view="console">測試</button>
  </nav>

  <main class="workspace" id="workspace">
    <!-- 左：題目／題解／提交紀錄 -->
    <section class="pane pane-left" id="paneLeft">
      <div class="pane-tabs" role="tablist">
        <button class="ptab active" data-left="desc">描述</button>
        <button class="ptab" data-left="solution">題解</button>
        <button class="ptab" data-left="history">提交紀錄</button>
      </div>
      <div class="pane-body scroll" id="leftBody">
        <div class="left-view active" data-left-view="desc" id="viewDesc"><div class="skeleton-lines"><i></i><i></i><i></i><i></i></div></div>
        <div class="left-view" data-left-view="solution" id="viewSolution"></div>
        <div class="left-view" data-left-view="history" id="viewHistory"></div>
      </div>
    </section>

    <div class="gutter gutter-x" id="gutterX" role="separator" aria-orientation="vertical" title="拖曳調整寬度"></div>

    <section class="right-col" id="rightCol">
      <!-- 右上：編輯器 -->
      <div class="pane pane-editor" id="paneEditor">
        <div class="pane-tabs editor-bar">
          <div class="lang-picker">
            <select id="langSelect" aria-label="程式語言">
              <option value="python">Python 3</option>
              <option value="typescript">TypeScript</option>
              <option value="javascript">JavaScript</option>
            </select>
            <svg viewBox="0 0 20 20" width="12" height="12" aria-hidden="true"><path d="m5.5 8 4.5 4.5L14.5 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span class="save-state" id="saveState"></span>
          <span class="flex"></span>
          <button class="tb-icon small" id="btnReset" title="重設為起始程式碼">
            <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M4.5 10a5.5 5.5 0 1 0 1.7-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M4 3.5v3.2h3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="editor-host" id="editorHost">
          <div class="editor-loading" id="editorLoading">載入編輯器…</div>
        </div>
        <div class="statusbar">
          <span class="env" id="envState"><i class="dot"></i><span>準備中</span></span>
          <span class="flex"></span>
          <span id="cursorPos">第 1 行，第 1 欄</span>
        </div>
      </div>

      <div class="gutter gutter-y" id="gutterY" role="separator" aria-orientation="horizontal" title="拖曳調整高度"></div>

      <!-- 右下：測試案例／結果 -->
      <div class="pane pane-console" id="paneConsole">
        <div class="pane-tabs">
          <button class="ptab active" data-console="cases">測試案例</button>
          <button class="ptab" data-console="result">測試結果</button>
          <span class="flex"></span>
          <button class="tb-icon small" id="btnToggleConsole" title="收合／展開">
            <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="m5.5 8 4.5 4.5L14.5 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="pane-body scroll">
          <div class="console-view active" data-console-view="cases" id="viewCases"></div>
          <div class="console-view" data-console-view="result" id="viewResult">
            <p class="muted empty">按「執行」或 <kbd>Ctrl</kbd> + <kbd>Enter</kbd>，用上面的測試案例執行你的程式碼。</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 題目列表抽屜 -->
  <div class="drawer-mask" id="drawerMask" hidden></div>
  <aside class="drawer" id="drawer" aria-label="題目列表" hidden>
    <div class="drawer-head">
      <div>
        <div class="drawer-title">線上練習</div>
        <div class="muted small">試行版，目前開放 10 題</div>
      </div>
      <button class="tb-icon" id="btnCloseDrawer" title="關閉">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="m5.5 5.5 9 9m0-9-9 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-search">
      <input id="drawerSearch" type="search" placeholder="搜尋題號或名稱" autocomplete="off">
    </div>
    <ol class="plist" id="plist"></ol>
    <div class="drawer-foot muted small" id="drawerStats"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
<script src="app.js"></script>
</body>
</html>
